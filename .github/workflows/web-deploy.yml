# Publish pipeline for the EmDash site (INF-4): rebuild static pages from the CMS and deploy.
# Triggers: CMS publish (repository_dispatch `emdash-publish`), nightly rebuild, manual.
# Scheduled and dispatch events always use the default branch's workflow; production is only
# deployed manually or by the nightly schedule, through the `production` environment.
name: web-deploy

on:
  repository_dispatch:
    types: [emdash-publish]
  schedule:
    # Nightly rebuild (also touches the production DB, which keeps Supabase from pausing).
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [testing, production]
        default: testing
      apply_migrations:
        description: "Apply pending EmDash migrations before building (needs the target fingerprint check to pass)"
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CMS publishes and manual runs target the chosen env (testing by default, testing for dispatch events);
    # the nightly schedule rebuilds production. Production uses the `production` environment (add required reviewers there for manual approval).
    environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'testing' }}
    concurrency:
      group: web-deploy-${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'testing' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment || (github.event_name == 'schedule' && 'production') || 'testing' }}
      CLOUDFLARE_ACCOUNT_ID: 2c1ea12e37cd89d9a6f6a62c6798d3a0
      PUBLIC_BUILD_SHA: ${{ github.sha }}
      WEB_MIN_POSTS: ${{ vars.WEB_MIN_POSTS || '0' }}
      WEB_MIN_PAGES: ${{ vars.WEB_MIN_PAGES || '3' }}
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_POOLER_URL }}
    steps:
      - name: Select environment
        run: |
          # production: top-level wrangler config has no `env`, so CLOUDFLARE_ENV stays unset.
          if [ "$TARGET" = production ]; then
            echo "SITE_ENV=production" >> "$GITHUB_ENV"
          else
            echo "SITE_ENV=testing" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_ENV=testing" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations are up to date (read-only)
        if: ${{ !inputs.apply_migrations }}
        working-directory: apps/web
        run: pnpm exec emdash migrate --from-config --check

      - name: Apply migrations
        if: ${{ inputs.apply_migrations }}
        working-directory: apps/web
        run: |
          # Non-interactive apply requires the target fingerprint printed by --status.
          fp=$(pnpm exec emdash migrate --from-config --status 2>&1 | grep -i 'target fingerprint' | head -1 | grep -oE '[A-Za-z0-9:_-]{16,}' | tail -1)
          [ -n "$fp" ] || { echo "::error::could not read target fingerprint"; exit 1; }
          pnpm exec emdash migrate --from-config --expected-target-fingerprint "$fp"

      - name: Build
        run: |
          set -o pipefail
          pnpm --filter web build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Empty-build guard
        run: |
          if grep -q 'runtime init failed' "$RUNNER_TEMP/build.log"; then
            echo "::error::build log contains 'runtime init failed': refusing to deploy an empty site"; exit 1
          fi
          cd apps/web/dist/client
          pages=$(find . -name index.html | wc -l)
          posts=$(find . -path './[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]/*' -name index.html | wc -l)
          echo "prerendered pages=$pages posts=$posts (min pages=$WEB_MIN_PAGES, min posts=$WEB_MIN_POSTS)"
          if [ "$pages" -lt "$WEB_MIN_PAGES" ]; then echo "::error::only $pages pages prerendered"; exit 1; fi
          if [ "$posts" -lt "$WEB_MIN_POSTS" ]; then echo "::error::only $posts posts prerendered, expected >= $WEB_MIN_POSTS"; exit 1; fi

      - name: Free-tier size guard
        working-directory: apps/web
        run: |
          pnpm exec wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry" -c dist/server/wrangler.json
          bytes=$(find "$RUNNER_TEMP/wrangler-dry" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.wasm' \) -print0 | xargs -0 cat | wc -c)
          assets=$(find dist/client -type f | wc -l)
          echo "worker uncompressed=$((bytes/1048576)) MiB (limit 64), static assets=$assets (limit 20000)"
          if [ "$bytes" -gt $((60*1048576)) ]; then echo "::error::Worker above 60 MiB"; exit 1; fi
          if [ "$assets" -gt 18000 ]; then echo "::error::more than 18000 static assets"; exit 1; fi

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy -c dist/server/wrangler.json
