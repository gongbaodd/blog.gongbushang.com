# Free-tier guards (INF-6): Supabase keep-alive for testing, nightly encrypted backup of production,
# and Cloudinary credit usage monitoring.
# The repo is public, so dumps are age-encrypted with a PUBLIC recipient key before upload; the private key stays offline.
name: web-guards

on:
  schedule:
    - cron: "41 3 * * *" # backup (also keeps production active)
    - cron: "23 5 * * *" # keep-alive for testing
    - cron: "11 6 * * *" # Cloudinary credit usage check
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  keepalive-testing:
    # Free projects pause after 7 idle days. Production is also kept alive by the nightly backup and web-deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testing
    steps:
      - name: select 1 via session pooler
        env:
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }}
        run: psql "$DATABASE_POOLER_URL" -v ON_ERROR_STOP=1 -tAc 'select 1'

  backup-production:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Install pg_dump 17 and age
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release; echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age

      - name: Dump and encrypt
        env:
          DATABASE_POOLER_URL: ${{ secrets.DATABASE_POOLER_URL }} # production session pooler (IPv4)
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }} # age public key (age1...)
        run: |
          set -euo pipefail
          [ -n "${DATABASE_POOLER_URL:-}" ] || { echo "::error::secret DATABASE_POOLER_URL is not set"; exit 1; }
          [ -n "${BACKUP_AGE_RECIPIENT:-}" ] || { echo "::error::secret BACKUP_AGE_RECIPIENT is not set"; exit 1; }
          schemas=(--schema=public)
          has_derived=$(/usr/lib/postgresql/17/bin/psql "$DATABASE_POOLER_URL" -v ON_ERROR_STOP=1 -tAc "select 1 from information_schema.schemata where schema_name = 'derived'")
          if [ "$has_derived" = "1" ]; then
            schemas+=(--schema=derived)
          else
            echo "::notice::schema 'derived' does not exist on production yet; backing up public schema only"
          fi
          echo "Dumping schemas: ${schemas[*]}"
          out="growgen-production-$(date -u +%Y%m%dT%H%M%SZ).dump.age"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_POOLER_URL" --format=custom "${schemas[@]}" --no-owner --no-privileges \
            | age -r "$BACKUP_AGE_RECIPIENT" -o "$out"
          ls -l "$out"
          [ "$(stat -c %s "$out")" -gt 1024 ] || { echo "::error::backup is suspiciously small"; exit 1; }
          echo "BACKUP_FILE=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: production-db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
          if-no-files-found: error

  cloudinary-usage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '11 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - name: Check Cloudinary credit usage
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          CLOUDINARY_WARN_PCT: ${{ vars.CLOUDINARY_WARN_PCT || '75' }}
          CLOUDINARY_FAIL_PCT: ${{ vars.CLOUDINARY_FAIL_PCT || '90' }}
        run: node apps/web/scripts/guards/cloudinary-usage.mjs
