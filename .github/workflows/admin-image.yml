# Builds apps/admin/Dockerfile and publishes it to GHCR so Altare can pull it (GON-212).
# The image is environment-agnostic and holds no secrets: DATABASE_URL, EMDASH_ENCRYPTION_KEY, Cloudinary, GitHub dispatch and
# Cloudflare Access values are runtime env vars set only in the Altare console (check:secrets in admin-ci guards the build output).
# The GHCR package is public; the source repo is public too, so the image reveals nothing the repo does not.
# Actions are pinned by commit SHA. Re-resolve with:
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>   (dereference annotated tags with git/tags/<sha>)
name: admin-image

on:
  push:
    branches: [master]
    paths:
      - "apps/admin/**"
      - "apps/web/src/lib/**"
      - "apps/web/src/plugins/**"
      - "apps/web/scripts/certs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".dockerignore"
      - ".github/workflows/admin-image.yml"
  workflow_dispatch:

concurrency:
  group: admin-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gongbaodd/growgen-admin

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive # packages/shiki-plantuml is a workspace member; the Dockerfile copies its package.json
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
